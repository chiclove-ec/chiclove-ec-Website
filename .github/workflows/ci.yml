name: CI

# El sitio solo se publica en Cloudflare Pages, por su integración Git nativa, que
# ejecuta `npm test` dentro de su propio build: si la suite falla, no publica. Este
# workflow es el check obligatorio de los PR a `main` y deja constancia en cada push
# a `main`; deploy-cloudflare.yml lo reutiliza antes de la vía manual de recuperación.
# Los PR de refresh-catalog.yml no lo disparan (son del GITHUB_TOKEN): ese workflow
# ejecuta estos mismos pasos y publica el resultado con el nombre de este check.
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Pruebas, build y coherencia de lo generado
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Suite de pruebas
        run: npm test

      - name: El build seguro produce el artefacto público
        run: npm run build:cloudflare

      - name: Lo generado está al día con el catálogo
        # `npm run gen` es idempotente: si deja diferencias, alguien tocó
        # js/products.js o el FAQ de la portada sin regenerar.
        run: |
          npm run gen
          if ! git diff --quiet; then
            echo "::error::Hay archivos generados desincronizados. Ejecuta 'npm run gen' y súbelos."
            git --no-pager diff --stat
            exit 1
          fi
          echo "Todo lo derivado coincide con el catálogo."
