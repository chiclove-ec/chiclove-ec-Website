name: Deploy public site to Cloudflare Pages

# El dominio de producción se publica por la integración Git nativa de
# Cloudflare Pages. Este workflow queda como vía manual de recuperación, para
# que nunca haya dos despliegues automáticos compitiendo por el mismo proyecto.
#
# Para activarlo (una vez):
#   1. Crea/valida el proyecto de Pages con el nombre de `cloudflare.projectName`
#      en site.config.json (hoy: chiclove-ec) y conéctalo a este repositorio.
#   2. Settings → Secrets and variables → Actions:
#        CLOUDFLARE_API_TOKEN    token con permiso "Cloudflare Pages: Edit"
#        CLOUDFLARE_ACCOUNT_ID   id de la cuenta
#   3. En el panel de Pages, añade el dominio propio (Custom domains).
#   4. Cuando ese dominio sea el oficial, cambia `canonicalOrigin` en
#      site.config.json: a partir de ahí todos los hosts publican declarándolo.
#
# Ver la sección "Cambiar de dominio" del README.

on:
  workflow_dispatch:

permissions:
  contents: read
  # Permite que Wrangler enlace el despliegue directo con el commit de GitHub.
  # Así el repositorio recibe el estado y la URL del despliegue igual que con la
  # integración Git nativa.
  deployments: write

concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

jobs:
  # `secrets` no está disponible en el `if` de un job, así que se comprueba aquí.
  guard:
    name: ¿Está configurado Cloudflare?
    runs-on: ubuntu-24.04
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare configurado: se desplegará."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::error::Faltan las credenciales de la vía manual de recuperación de Cloudflare."
            exit 1
          fi

  ci:
    name: CI
    needs: guard
    if: needs.guard.outputs.configured == 'true'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  deploy:
    name: Publicar en Cloudflare Pages
    needs: [guard, ci]
    if: needs.guard.outputs.configured == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: cloudflare-pages
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Build allowlisted public artifact
        run: npm run build:cloudflare

      # Se lee a través de loadSiteConfig(), que valida el nombre del proyecto
      # (`^[a-z0-9][a-z0-9-]*$`) y la rama. Así lo que acaba en la línea de
      # comandos de wrangler no puede contener metacaracteres de shell ni saltos
      # de línea que falsifiquen salidas de paso.
      - name: Leer la configuración del sitio
        id: project
        run: |
          node --input-type=module -e '
            import { appendFileSync } from "node:fs";
            import { loadSiteConfig } from "./scripts/lib/site-config.mjs";
            const { cloudflare, canonicalOrigin } = loadSiteConfig();
            if (!/^[a-z0-9][a-z0-9-]*$/.test(cloudflare.productionBranch.replace(/[/_.]/g, "-"))) {
              throw new Error("productionBranch no es un nombre de rama admisible");
            }
            appendFileSync(process.env.GITHUB_OUTPUT,
              `name=${cloudflare.projectName}\n` +
              `branch=${cloudflare.productionBranch}\n` +
              `origin=${canonicalOrigin}\n`);
            console.log(`Proyecto ${cloudflare.projectName} · rama ${cloudflare.productionBranch} · dominio ${canonicalOrigin}`);
          '

      # `functions/` se queda en la raíz del repositorio, no en dist/: wrangler lo
      # compila desde el directorio de trabajo y ahí vive la negociación de markdown.
      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: >-
            pages deploy dist
            --project-name=${{ steps.project.outputs.name }}
            --branch=${{ steps.project.outputs.branch }}

      # Los valores van por `env` y se citan en el shell: nunca se interpolan
      # directamente en el script, que es como se cuelan inyecciones.
      - name: Resumen
        env:
          PROJECT: ${{ steps.project.outputs.name }}
          ORIGIN: ${{ steps.project.outputs.origin }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          {
            echo "### Cloudflare Pages"
            echo ""
            echo "- Proyecto: \`${PROJECT}\`"
            echo "- Despliegue: ${DEPLOYMENT_URL}"
            echo "- Dominio declarado: \`${ORIGIN}\`"
          } >> "$GITHUB_STEP_SUMMARY"
